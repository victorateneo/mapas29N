<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de prioridades · Ateneo del Dato</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
/* Manual de marca Ateneo 2026: azul eléctrico protagonista, azul oscuro en lugar del negro, blanco.
   Layout: mapa a pantalla completa; cabecera azul oscuro; panel de control a la izquierda; leyenda abajo a la derecha. */
/* Gigalypse: coloca el archivo en /assets/fonts/Gigalypse.woff2. Mientras no esté, se usa Montserrat. */
@font-face { font-family: "Gigalypse"; src: url("/assets/fonts/Gigalypse.woff2") format("woff2"); font-display: swap; }
:root {
  --azul: #0033FF;          /* A1 */
  --oscuro: #00192C;        /* G3: textos y cabecera */
  --blanco: #FFFFFF;
  --gris: #6C6D6D;          /* G2: texto secundario */
  --neutro: #D3D4CF;        /* G1: Nula, sin acceso */
  --fondo: #EEF2F8;         /* mar: tinte muy claro del azul */
  --linea: #DCE3EE;
  --rojo: #CA0617;          /* R1: bajadas */
  --font-display: "Gigalypse", "Montserrat", system-ui, sans-serif;
  --font-body: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--fondo); color: var(--oscuro); font-family: var(--font-body); font-size: 13px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
.display { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1.05; }
.num { font-variant-numeric: tabular-nums; }

#app { position: absolute; inset: 0; display: grid; grid-template-rows: 60px 1fr; }
header {
  background: var(--oscuro); color: var(--blanco);
  display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: .04em; line-height: 1; white-space: nowrap; }
.wordmark small { display: block; font-size: 9px; letter-spacing: .32em; font-weight: 600; opacity: .7; margin-top: 3px; }
.cross { opacity: .45; font-weight: 300; font-size: 18px; }
.client { font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; border: 1px solid rgba(255,255,255,.35); padding: 5px 9px; border-radius: 3px; white-space: nowrap; }
.title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.title h1 { font-size: 17px; white-space: nowrap; }
.title .sub { font-size: 11px; opacity: .65; white-space: nowrap; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.who .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--azul); box-shadow: 0 0 0 3px rgba(0,51,255,.35); }

main { position: relative; }
#map { position: absolute; inset: 0; }

/* Panel */
#panel {
  position: absolute; top: 16px; left: 16px; width: 290px; max-height: calc(100% - 32px); overflow-y: auto;
  background: var(--blanco); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,25,44,.12);
  display: flex; flex-direction: column; z-index: 3;
}
.sec { padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; border-bottom: 1px solid var(--linea); }
.sec:last-child { border-bottom: 0; }
.lbl { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gris); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1.5px solid var(--oscuro); border-radius: 4px; overflow: hidden; }
.seg button { background: var(--blanco); border: 0; border-right: 1.5px solid var(--oscuro); padding: 7px 2px; font-size: 11px; font-weight: 600; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--oscuro); color: var(--blanco); }
.seg button:hover:not([aria-pressed="true"]) { background: #E6ECF7; }
select, input[type="search"] {
  width: 100%; padding: 8px 10px; border: 1px solid #B9C3D3; border-radius: 4px; background: var(--blanco);
}
.searchwrap { position: relative; }
#results { position: absolute; left: 0; right: 0; top: calc(100% + 3px); background: var(--blanco); border: 1px solid #B9C3D3; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,25,44,.15); z-index: 10; max-height: 260px; overflow-y: auto; display: none; }
#results button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; background: none; border: 0; border-bottom: 1px solid var(--linea); cursor: pointer; }
#results button:hover, #results button:focus-visible { background: #E6ECF7; }
#results .p { color: var(--gris); font-size: 11px; white-space: nowrap; }
.chips { display: flex; flex-direction: column; gap: 4px; }
.chip { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 9px; padding: 5px 6px; border-radius: 4px; border: 0; background: none; cursor: pointer; text-align: left; }
.chip:hover { background: #F1F4FA; }
.chip .sw { width: 14px; height: 14px; border-radius: 2px; border: 1px solid rgba(0,25,44,.15); }
.chip .n { color: var(--gris); font-size: 11px; }
.chip[aria-pressed="false"] { opacity: .38; }
.chip[aria-pressed="false"] .sw { background: transparent !important; }
.hint { font-size: 11px; color: var(--gris); line-height: 1.45; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 12px; border-radius: 4px; border: 0; background: var(--azul); color: var(--blanco); font-weight: 600; cursor: pointer; }
.btn:hover { background: #0029CC; }
.btn[disabled] { background: var(--neutro); color: var(--gris); cursor: default; }
.demo { background: #F4F7FC; }
#focus-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; background: var(--oscuro); color: var(--blanco); border-radius: 4px; padding: 9px 10px 9px 12px; }
#focus-bar[hidden] { display: none; }
#focus-bar > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 140px; }
#focus-bar .lbl { color: #A9D5FF; }
#focus-bar b { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 14px; line-height: 1.15; overflow-wrap: anywhere; }
#focus-bar button { flex: none; background: transparent; color: var(--blanco); border: 1px solid rgba(255,255,255,.5); border-radius: 3px; padding: 5px 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
#focus-bar button:hover { background: rgba(255,255,255,.12); }
.demo .lbl { color: var(--azul); }

/* Panel plegable */
.panel-top { display: flex; align-items: center; justify-content: space-between; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 6px; margin: -4px -6px -4px 0; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--gris); }
.icon-btn:hover { background: #F1F4FA; color: var(--oscuro); }
#panel.closed { display: none; }
#panel-open { position: absolute; top: 16px; left: 16px; z-index: 3; display: none; align-items: center; gap: 8px; padding: 9px 14px; border: 0; border-radius: 6px; background: var(--oscuro); color: var(--blanco); font-weight: 600; cursor: pointer; box-shadow: 0 6px 24px rgba(0,25,44,.2); }
#panel-open:hover { background: #062B47; }
#panel.closed ~ #panel-open { display: inline-flex; }
#panel.closed ~ #count { left: 16px; }
.mut-sw { display: inline-block; width: 12px; height: 10px; border-radius: 2px; background: #E3E8F0; border: 1px solid rgba(0,25,44,.12); vertical-align: -1px; margin-right: 5px; }
.ctrl-3d { font-weight: 800; font-size: 12px; letter-spacing: .02em; color: var(--oscuro); }
.ctrl-3d[aria-pressed="true"] { background: var(--oscuro) !important; color: var(--blanco); }
.maplibregl-ctrl-home .maplibregl-ctrl-icon { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }

#fatal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: var(--fondo); z-index: 20; padding: 24px; }
#fatal div { max-width: 440px; background: var(--blanco); border-radius: 6px; padding: 24px; box-shadow: 0 6px 24px rgba(0,25,44,.12); display: flex; flex-direction: column; gap: 10px; }
#fatal b { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 18px; }
#status { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: var(--oscuro); color: var(--blanco); padding: 8px 14px; border-radius: 4px; font-size: 12px; z-index: 4; display: none; box-shadow: 0 6px 20px rgba(0,25,44,.25); }
#count { position: absolute; left: 322px; bottom: 24px; background: var(--blanco); border-radius: 4px; padding: 6px 10px; font-size: 11.5px; box-shadow: 0 4px 14px rgba(0,25,44,.1); z-index: 3; }

/* Estilos base de MapLibre (mínimos necesarios) */
.maplibregl-map { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; user-select: none; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-canvas-container.maplibregl-touch-drag-pan, .maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: pinch-zoom; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan, .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: none; }
.maplibregl-ctrl-top-right, .maplibregl-ctrl-bottom-right { position: absolute; right: 0; z-index: 2; pointer-events: none; }
.maplibregl-ctrl-top-right { top: 0; } .maplibregl-ctrl-bottom-right { bottom: 0; }
.maplibregl-ctrl { pointer-events: auto; clear: both; transform: translate(0); }
.maplibregl-ctrl-top-right .maplibregl-ctrl { float: right; margin: 16px 16px 0 0; }
.maplibregl-ctrl-bottom-right .maplibregl-ctrl { float: right; margin: 0 10px 6px 0; }
.maplibregl-ctrl-group { background: var(--blanco); overflow: hidden; }
.maplibregl-ctrl-group button { display: block; width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer; position: relative; }
.maplibregl-ctrl-group button + button { border-top: 1px solid var(--linea); }
.maplibregl-ctrl-group button:hover { background: #F1F4FA; }
.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon::before, .maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon::before { content: ""; position: absolute; left: 10px; top: 15px; width: 12px; height: 2px; background: var(--oscuro); }
.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon::after { content: ""; position: absolute; left: 15px; top: 10px; width: 2px; height: 12px; background: var(--oscuro); }
.maplibregl-ctrl-attrib { background: rgba(255,255,255,.85); padding: 2px 8px; border-radius: 3px; color: var(--gris); }
.maplibregl-ctrl-attrib a { color: var(--gris); }
.maplibregl-ctrl-attrib-button { display: none; }
.maplibregl-popup { position: absolute; top: 0; left: 0; display: flex; will-change: transform; pointer-events: none; z-index: 4; }
.maplibregl-popup-anchor-top, .maplibregl-popup-anchor-top-left, .maplibregl-popup-anchor-top-right { flex-direction: column; }
.maplibregl-popup-anchor-bottom, .maplibregl-popup-anchor-bottom-left, .maplibregl-popup-anchor-bottom-right { flex-direction: column-reverse; }
.maplibregl-popup-anchor-left { flex-direction: row; } .maplibregl-popup-anchor-right { flex-direction: row-reverse; }
.maplibregl-popup-tip { width: 0; height: 0; border: 8px solid transparent; z-index: 1; }
.maplibregl-popup-anchor-top .maplibregl-popup-tip { align-self: center; border-top: none; border-bottom-color: var(--oscuro); }
.maplibregl-popup-anchor-top-left .maplibregl-popup-tip { align-self: flex-start; border-top: none; border-left: none; border-bottom-color: var(--oscuro); }
.maplibregl-popup-anchor-top-right .maplibregl-popup-tip { align-self: flex-end; border-top: none; border-right: none; border-bottom-color: var(--oscuro); }
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip { align-self: center; border-bottom: none; border-top-color: var(--blanco); }
.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip { align-self: flex-start; border-bottom: none; border-left: none; border-top-color: var(--blanco); }
.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { align-self: flex-end; border-bottom: none; border-right: none; border-top-color: var(--blanco); }
.maplibregl-popup-anchor-left .maplibregl-popup-tip { align-self: center; border-left: none; border-right-color: var(--blanco); }
.maplibregl-popup-anchor-right .maplibregl-popup-tip { align-self: center; border-right: none; border-left-color: var(--blanco); }
.maplibregl-popup-content { position: relative; background: var(--blanco); pointer-events: auto; }
.maplibregl-popup-close-button { position: absolute; background: transparent; border: 0; cursor: pointer; border-radius: 0 6px 0 0; }
.maplibregl-popup-close-button:hover { background: rgba(255,255,255,.12); }

/* Popup */
.maplibregl-popup-content { padding: 0; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,25,44,.22); font-family: var(--font-body); color: var(--oscuro); }
.maplibregl-popup-close-button { font-size: 18px; width: 28px; height: 28px; color: var(--blanco); right: 2px; top: 2px; }
.pp { width: 300px; }
.pp-h { background: var(--oscuro); color: var(--blanco); padding: 10px 34px 10px 14px; border-radius: 6px 6px 0 0; display: flex; flex-direction: column; gap: 4px; }
.pp-h .t { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; font-weight: 600; }
.pp-h .n { font-family: var(--font-display); font-weight: 800; font-size: 17px; text-transform: uppercase; line-height: 1.1; text-wrap: balance; }
.pp-h .loc { font-size: 11px; opacity: .75; }
.pp-b { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.prio { display: flex; align-items: center; gap: 10px; }
.pill { padding: 4px 10px; border-radius: 3px; font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.score { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.score .top { display: flex; justify-content: space-between; font-size: 11px; color: var(--gris); }
.score .top b { color: var(--oscuro); font-weight: 600; }
.bar { height: 6px; background: #E6ECF7; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--oscuro); }
.k { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.k div { background: #F1F4FA; border-radius: 4px; padding: 5px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.k .l { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); font-weight: 600; }
.k .v { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp { display: flex; flex-direction: column; gap: 6px; }
.cmp .hd { display: flex; justify-content: space-between; align-items: baseline; }
.cmp .key { display: flex; gap: 10px; font-size: 10px; color: var(--gris); }
.cmp .key span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.cmp .key .a::before { background: #A9D5FF; }
.cmp .key .b::before { background: var(--oscuro); }
.cr { display: grid; grid-template-columns: 82px 1fr 64px; align-items: center; gap: 8px; font-size: 11.5px; line-height: 1.2; }
.cr .nm { color: var(--oscuro); }
.track { position: relative; height: 14px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: #E6ECF7; }
.track .seg2 { position: absolute; top: 6px; height: 2px; background: #7FBDFF; }
.track .d { position: absolute; top: 3px; width: 8px; height: 8px; border-radius: 50%; transform: translateX(-4px); }
.track .d.a { background: #A9D5FF; }
.track .d.b { background: var(--oscuro); }
.cr .dv { text-align: right; font-weight: 600; white-space: nowrap; }
.up { color: var(--azul); } .down { color: var(--rojo); } .eq { color: var(--gris); }
.dist { display: flex; height: 10px; border-radius: 2px; overflow: hidden; }
.foot { font-size: 10.5px; color: var(--gris); display: flex; justify-content: space-between; }

.maplibregl-ctrl-group { border-radius: 4px; box-shadow: 0 4px 14px rgba(0,25,44,.12) !important; }
.maplibregl-ctrl-attrib { font-size: 10px; }

@media (max-width: 760px) {
  .title .sub, .who span, .client { display: none; }
  #panel { width: calc(100% - 32px); max-height: 46%; }
  #count { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="wordmark">ATENEO DEL DATO<small>DATOS PRECISOS</small></div>
      <span class="cross" aria-hidden="true">×</span>
      <span class="client">Frente Amplio</span>
    </div>
    <div class="title">
      <h1 class="display">Mapa de prioridades</h1>
      <span class="sub">Generales 29N · España</span>
    </div>
    <div class="who"><i class="dot" aria-hidden="true"></i><span id="who-txt">Rol: Ve todo</span></div>
  </header>
  <main>
    <div id="map" role="region" aria-label="Mapa de prioridades"></div>

    <aside id="panel" aria-label="Controles del mapa">
      <div class="sec">
        <div class="panel-top"><span class="lbl">Nivel</span><button type="button" class="icon-btn" id="panel-close" aria-controls="panel" title="Ocultar el panel para ver más mapa"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Ocultar</button></div>
        <div class="seg" role="group" aria-label="Nivel geográfico">
          <button id="lv-ccaa" data-lv="ccaa" aria-pressed="false">CCAA</button>
          <button id="lv-prov" data-lv="provincias" aria-pressed="true">Provincias</button>
          <button id="lv-mun" data-lv="municipios" aria-pressed="false">Municipios</button>
          <button id="lv-sscc" data-lv="secciones" aria-pressed="false">Secciones</button>
        </div>
        <p class="hint" id="lv-hint"></p>
        <div id="focus-bar" hidden><div><span class="lbl" id="focus-type">Provincia</span><b id="focus-name"></b></div><button type="button" id="focus-exit">Volver a España</button></div>
      </div>
      <div class="sec">
        <label class="lbl" for="sel-ccaa">Comunidad</label>
        <select id="sel-ccaa"></select>
        <label class="lbl" for="q">Buscar municipio</label>
        <div class="searchwrap">
          <input id="q" type="search" placeholder="Ej. Getafe, Vigo, Elche…" autocomplete="off">
          <div id="results" role="listbox" aria-label="Resultados"></div>
        </div>
      </div>
      <div class="sec" id="sec-filter">
        <span class="lbl" id="chips-lbl">Prioridad</span>
        <div class="chips" id="chips"></div>
        <p class="hint" id="chips-note"></p>
      </div>
      <div class="sec">
        <button class="btn" id="dl" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1.5v8M3.8 6.4 7 9.6l3.2-3.2M1.8 12.5h10.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="dl-txt">Descargar CSV</span>
        </button>
        <p class="hint" id="dl-hint"></p>
      </div>
      <div class="sec">
        <span class="lbl">Tu acceso</span>
        <p class="hint" id="me-txt">—</p>
        <a class="hint" href="/cdn-cgi/access/logout">Cerrar sesión</a>
      </div>
    </aside>

    <button type="button" id="panel-open" aria-controls="panel"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 3.5h10M4 7h6M5.5 10.5h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Filtros</button>
    <div id="count" class="num"></div>
    <div id="status" role="status"></div>
    <div id="fatal" role="alert"><div><b>Sin acceso</b><p id="fatal-txt" class="hint"></p><a class="hint" href="/cdn-cgi/access/logout">Entrar con otro email</a></div></div>
  </main>
</div>

<script>
"use strict";
// ── Escala de prioridad (manual 2026): azul oscuro para Máxima, luego azules separados de la escala ──
const PRIOS = ["Máxima", "Alta", "Media", "Baja", "Nula", "Sin datos"];
const P_COLOR = ["#00192C", "#0033FF", "#56A3FF", "#A9D5FF", "#D3D4CF", "#FFFFFF"];   // G3 A1 A4 A6 G1 blanco
const P_TEXT  = ["#FFFFFF", "#FFFFFF", "#00192C", "#00192C", "#00192C", "#6C6D6D"];
const pct = v => v == null ? "—" : f1(v * 100) + " %";
const LV_HINT = {
  ccaa: "Scoring final medio de la comunidad (ponderado por censo). Niveles repartidos entre las 19 comunidades.",
  provincias: "Prioridad del comité según el modelo de escaños. Pincha en una para ver sus secciones censales.",
  municipios: "Índice municipal: scoring medio de sus secciones × tamaño (log del censo).",
  secciones: "Todas las secciones censales. Se cargan por provincia, primero las que tienes a la vista."
};
const fmtN = new Intl.NumberFormat("es-ES", { useGrouping: "always" });
const f1 = v => v == null ? "—" : v.toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const panelOpen = () => !document.getElementById("panel").classList.contains("closed");
const PAD = () => (innerWidth < 760 ? { top: 20, bottom: 20, left: 20, right: 20 } : { top: 40, bottom: 40, left: panelOpen() ? 330 : 60, right: 60 });

// ── Estado ────────────────────────────────────────────────────────
const S = {
  level: "provincias", focus: null, meta: null, roles: null, role: "nacional", allowed: null,
  filters: new Set([0, 1, 2, 3, 4, 5]),
  terr: null, mun: null, munFC: null, prov: null, ccaa: null,
  sscc: new Map(), ssccLoading: new Map(), cpro2cca: {}, provBBox: {}, ccaaBBox: {}
};
let map;

// En producción estas rutas apuntan al Worker (/api/...), que filtra por rol.
const API = {
  meta: "data/meta.json", me: "/api/me", terr: "data/territorios.json",
  mun: "data/municipios.json", munGeo: "geo/municipios.topo.json",
  prov: "geo/provincias.json", ccaa: "geo/ccaa.json",
  ssccData: c => `data/sscc/${c}.json`, ssccGeo: c => `geo/sscc/${c}.topo.json`
};
const getJSON = async u => { const r = await fetch(u); if (!r.ok) throw new Error(`${r.status} ${u}`); return r.json(); };
const rowObj = (cols, row) => { const o = {}; cols.forEach((c, i) => o[c] = row[i]); return o; };
const status = (t, ms) => { const el = document.getElementById("status"); el.textContent = t; el.style.display = t ? "block" : "none"; if (ms) setTimeout(() => { if (el.textContent === t) el.style.display = "none"; }, ms); };
function fatal(msg) { status(""); document.getElementById("fatal-txt").textContent = msg; document.getElementById("fatal").style.display = "flex"; }
const isAllowed = cca => !S.allowed || S.allowed.has(cca);
const ccaaName = c => S.meta.ccaa.find(x => x.cca === c)?.name ?? "";
const EMPTY = { type: "FeatureCollection", features: [] };
const prioColor = ["match", ["get", "_p"], 0, P_COLOR[0], 1, P_COLOR[1], 2, P_COLOR[2], 3, P_COLOR[3], 4, P_COLOR[4], P_COLOR[5]];

function bboxOf(geom) {
  let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
  const walk = c => { if (typeof c[0] === "number") { x0 = Math.min(x0, c[0]); y0 = Math.min(y0, c[1]); x1 = Math.max(x1, c[0]); y1 = Math.max(y1, c[1]); } else c.forEach(walk); };
  walk(geom.coordinates); return [x0, y0, x1, y1];
}
const unionB = bs => bs.reduce((a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]);
const fit = (bb, opts = {}) => map.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], { padding: PAD(), duration: 800, ...opts });
const popPad = () => (innerWidth < 760 ? PAD() : { ...PAD(), right: 380 });
const homeBB = () => S.allowed ? unionB([...S.allowed].map(c => S.ccaaBBox[c])) : [-9.6, 35.8, 4.5, 43.9];

// Velo: un rectángulo que cubre todo con la zona enfocada como agujero
function veilFor(geom) {
  const outer = [[-40, 15], [25, 15], [25, 55], [-40, 55], [-40, 15]];
  const holes = geom.type === "Polygon" ? [geom.coordinates[0]] : geom.coordinates.map(p => p[0]);
  return { type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [outer, ...holes] } }] };
}

// ── Arranque ──────────────────────────────────────────────────────
async function init() {
  status("Cargando datos…");
  const meR = await fetch(API.me);
  if (!meR.ok) return fatal(meR.status === 403 ? await meR.text() : "No se ha podido comprobar tu sesión. Recarga la página.");
  S.me = await meR.json();
  const [meta, terr, prov, ccaa] = await Promise.all([getJSON(API.meta), getJSON(API.terr), getJSON(API.prov), getJSON(API.ccaa)]);
  Object.assign(S, { meta, terr, prov, ccaa });
  meta.ccaa.forEach(c => c.provincias.forEach(p => S.cpro2cca[p] = c.cca));
  const iP = terr.cols.indexOf("pidx");
  prov.features.forEach(f => { const p = f.properties, t = terr.provincias[p.CPRO] || terr.provincias[p.CPRO]; f.properties = { _id: p.CPRO, _cca: p.CCA, _p: t ? t[iP] : 5 }; S.provBBox[p.CPRO] = bboxOf(f.geometry); });
  ccaa.features.forEach(f => { const p = f.properties, t = terr.ccaa[p.CCA]; f.properties = { _id: p.CCA, _cca: p.CCA, _p: t ? t[iP] : 5 }; S.ccaaBBox[p.CCA] = bboxOf(f.geometry); });

  map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
      sources: {},
      layers: [{ id: "bg", type: "background", paint: { "background-color": "#EEF2F8" } }]
    },
    bounds: [[-9.6, 35.8], [4.5, 43.9]], fitBoundsOptions: { padding: PAD() },
    maxBounds: [[-22, 25], [9, 46.5]], minZoom: 4, maxZoom: 17, maxPitch: 70, attributionControl: false
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: "Secciones y límites: INE 2025 · Datos: Ateneo del Dato" }));
  map.addControl(new HomeControl(), "top-right");
  map.addControl(new ThreeDControl(), "top-right");
  await new Promise(r => map.on("load", r));
  buildLayers();
  bindUI();
  applyRole(S.me);
  setLevel("provincias");
  status("");
  loadMunicipios();   // en segundo plano: buscador y nivel municipal
}

function buildLayers() {
  for (const s of ["ccaa", "prov"]) map.addSource(s, { type: "geojson", data: S[s], promoteId: "_id" });
  for (const s of ["mun", "sscc", "veil", "focus"]) map.addSource(s, { type: "geojson", data: EMPTY, promoteId: s === "veil" || s === "focus" ? undefined : "_id" });

  const hoverLine = w => ["case", ["boolean", ["feature-state", "hover"], false], w, 0];
  const vis = { visibility: "none" };

  map.addLayer({ id: "land", type: "fill", source: "ccaa", paint: { "fill-color": "#FFFFFF" } });
  map.addLayer({ id: "ccaa-fill", type: "fill", source: "ccaa", paint: { "fill-color": prioColor }, layout: vis });
  map.addLayer({ id: "prov-fill", type: "fill", source: "prov", paint: { "fill-color": prioColor }, layout: vis });
  map.addLayer({ id: "mun-fill", type: "fill", source: "mun", paint: { "fill-color": prioColor }, layout: vis });
  map.addLayer({ id: "mun-line", type: "line", source: "mun", paint: { "line-color": "#FFFFFF", "line-opacity": ["interpolate", ["linear"], ["zoom"], 5, 0.35, 9, 0.85], "line-width": ["interpolate", ["linear"], ["zoom"], 5, 0.3, 9, 1, 12, 1.6] }, layout: vis });
  map.addLayer({ id: "sscc-fill", type: "fill", source: "sscc", paint: { "fill-color": prioColor }, layout: vis });
  map.addLayer({ id: "sscc-line", type: "line", source: "sscc", paint: { "line-color": "#FFFFFF", "line-opacity": ["interpolate", ["linear"], ["zoom"], 7, 0.25, 12, 0.7], "line-width": ["interpolate", ["linear"], ["zoom"], 7, 0.2, 12, 0.8] }, layout: vis });
  map.addLayer({ id: "mask", type: "fill", source: "ccaa", paint: { "fill-color": "#E3E8F0", "fill-opacity": 1 }, filter: ["boolean", false] });
  map.addLayer({ id: "prov-line", type: "line", source: "prov", paint: { "line-color": "#00192C", "line-opacity": 0.5, "line-width": ["interpolate", ["linear"], ["zoom"], 5, 0.6, 10, 1.2] } });
  map.addLayer({ id: "ccaa-line", type: "line", source: "ccaa", paint: { "line-color": "#00192C", "line-width": ["interpolate", ["linear"], ["zoom"], 5, 1.1, 10, 2.2] } });
  // Foco: velo blanco alrededor y contorno marcado
  map.addLayer({ id: "veil", type: "fill", source: "veil", paint: { "fill-color": "#FFFFFF", "fill-opacity": 0.82 } });
  map.addLayer({ id: "focus-halo", type: "line", source: "focus", paint: { "line-color": "#FFFFFF", "line-width": 7, "line-opacity": 0.9 } });
  map.addLayer({ id: "focus-line", type: "line", source: "focus", paint: { "line-color": "#00192C", "line-width": 3 } });
  for (const s of ["mun", "sscc", "prov", "ccaa"]) {
    map.addLayer({ id: `${s}-hover`, type: "line", source: s, paint: { "line-color": "#0033FF", "line-width": hoverLine(2.6) }, layout: vis });
  }
  addBasemap();

  // Hover sobre la capa activa
  let hov = null;
  const clearHov = () => { if (hov) map.setFeatureState(hov, { hover: false }); hov = null; map.getCanvas().style.cursor = ""; };
  map.on("mousemove", e => {
    const f = pickFeature(e.point);
    if (!f) return clearHov();
    if (hov && hov.source === f.source && hov.id === f.id) return;
    clearHov(); hov = { source: f.source, id: f.id };
    map.setFeatureState(hov, { hover: true }); map.getCanvas().style.cursor = "pointer";
  });
  map.on("mouseout", clearHov);
  map.on("click", e => onClick(e));
}

// Mapa base (OpenFreeMap / OpenStreetMap, esquema OpenMapTiles) recoloreado a la marca.
// Debajo de los colores: tierra fuera de España, agua y zonas urbanas. Encima: carreteras y ríos
// en blanco translúcido (se ven sin tapar la prioridad), fronteras y nombres de lugares.
// Se añade después de cargar el mapa: si el servicio no responde, el resto funciona igual.
function addBasemap() {
  map.addSource("omt", { type: "vector", url: "https://tiles.openfreemap.org/planet" });
  const L = (id, layer, extra, before) => { try { map.addLayer({ id, source: "omt", "source-layer": layer, ...extra }, before); } catch (e) { console.warn(id, e); } };
  // Debajo de todo lo nuestro
  map.setPaintProperty("bg", "background-color", "#F3F5F9");
  L("b-agua", "water", { type: "fill", paint: { "fill-color": "#DCE6F2" } }, "land");
  L("b-urbano", "landuse", { type: "fill", minzoom: 6, filter: ["in", ["get", "class"], ["literal", ["residential", "suburb", "neighbourhood", "commercial", "industrial"]]],
    paint: { "fill-color": "#E6EAF1", "fill-opacity": 0.9 } }, "land");
  // Agua interior sobre los colores (embalses, lagos), para orientarse
  L("b-embalses", "water", { type: "fill", minzoom: 7, filter: ["!=", ["get", "class"], "ocean"], paint: { "fill-color": "#DCE6F2", "fill-opacity": 0.85 } }, "mask");
  L("b-rios", "waterway", { type: "line", minzoom: 8, filter: ["in", ["get", "class"], ["literal", ["river", "canal"]]],
    paint: { "line-color": "#C9D8EC", "line-width": ["interpolate", ["linear"], ["zoom"], 8, 0.6, 13, 2] } }, "mask");
  // Carreteras: blanco translúcido sobre los colores; más detalle según se acerca
  const roadW = (a, b) => ["interpolate", ["exponential", 1.5], ["zoom"], 6, a, 14, b];
  L("b-calles", "transportation", { type: "line", minzoom: 12, filter: ["in", ["get", "class"], ["literal", ["minor", "service", "tertiary"]]],
    layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#FFFFFF", "line-opacity": 0.55, "line-width": roadW(0.2, 1.6) } }, "mask");
  L("b-carreteras", "transportation", { type: "line", minzoom: 8, filter: ["in", ["get", "class"], ["literal", ["primary", "secondary"]]],
    layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#FFFFFF", "line-opacity": 0.7, "line-width": roadW(0.3, 3) } }, "mask");
  L("b-autovias", "transportation", { type: "line", minzoom: 6, filter: ["in", ["get", "class"], ["literal", ["motorway", "trunk"]]],
    layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#FFFFFF", "line-opacity": 0.85, "line-width": roadW(0.6, 4) } }, "mask");
  L("b-fronteras", "boundary", { type: "line", filter: ["all", ["==", ["get", "admin_level"], 2], ["!=", ["get", "maritime"], 1]],
    paint: { "line-color": "#9AA7BA", "line-width": 1, "line-dasharray": [3, 2] } }, "mask");
  // Edificios en 3D (OpenStreetMap): solo en modo 3D y de cerca. Blancos y algo translúcidos,
  // como una maqueta, para que el color de la sección se siga viendo en el suelo.
  L("b-edificios", "building", { type: "fill-extrusion", minzoom: 13, layout: { visibility: S.d3 ? "visible" : "none" },
    paint: { "fill-extrusion-color": "#FFFFFF", "fill-extrusion-vertical-gradient": true,
      "fill-extrusion-height": ["interpolate", ["linear"], ["zoom"], 13, 0, 13.8, ["coalesce", ["get", "render_height"], 8]],
      "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
      "fill-extrusion-opacity": 0.82 } }, "veil");
  // Nombres, por encima de todo
  const name = ["coalesce", ["get", "name:latin"], ["get", "name"]];   // nombre oficial local (A Coruña, Ourense, Girona…)
  const paint = { "text-color": "#00192C", "text-halo-color": "rgba(255,255,255,.92)", "text-halo-width": 1.6, "text-halo-blur": 0.3 };
  const font = w => [w === "b" ? "Noto Sans Bold" : "Noto Sans Regular"];
  L("lbl-barrios", "place", { type: "symbol", minzoom: 12, filter: ["in", ["get", "class"], ["literal", ["suburb", "quarter", "neighbourhood"]]],
    layout: { "text-field": name, "text-font": font(), "text-size": 11, "text-transform": "uppercase", "text-letter-spacing": 0.08, "text-padding": 4 },
    paint: { ...paint, "text-color": "#3A5068" } });
  L("lbl-pueblos", "place", { type: "symbol", minzoom: 10, filter: ["in", ["get", "class"], ["literal", ["village", "hamlet"]]],
    layout: { "text-field": name, "text-font": font(), "text-size": ["interpolate", ["linear"], ["zoom"], 10, 10.5, 14, 13], "text-padding": 4 },
    paint: { ...paint, "text-color": "#1E3A52" } });
  L("lbl-villas", "place", { type: "symbol", minzoom: 8, filter: ["==", ["get", "class"], "town"],
    layout: { "text-field": name, "text-font": font(), "text-size": ["interpolate", ["linear"], ["zoom"], 8, 10.5, 12, 13.5], "text-padding": 4 }, paint });
  L("lbl-ciudades", "place", { type: "symbol", minzoom: 5, filter: ["==", ["get", "class"], "city"],
    layout: { "text-field": name, "text-font": font("b"), "text-size": ["interpolate", ["linear"], ["zoom"], 5, ["case", ["<=", ["get", "rank"], 4], 12, 10.5], 10, 15], "text-padding": 6,
      "symbol-sort-key": ["get", "rank"] }, paint });
  L("lbl-paises", "place", { type: "symbol", maxzoom: 7, filter: ["==", ["get", "class"], "country"],
    layout: { "text-field": name, "text-font": font("b"), "text-size": 12, "text-transform": "uppercase", "text-letter-spacing": 0.2 },
    paint: { ...paint, "text-color": "#6C7A8C" } });
}

// Botón «3D»: inclina el mapa y levanta los edificios. Con el botón derecho (o dos dedos) se gira.
class ThreeDControl {
  onAdd() {
    const el = document.createElement("div");
    el.className = "maplibregl-ctrl maplibregl-ctrl-group";
    el.innerHTML = `<button type="button" class="ctrl-3d" aria-pressed="false" title="Vista 3D con edificios">3D</button>`;
    this.btn = el.querySelector("button");
    this.btn.onclick = () => toggle3D(!S.d3);
    return el;
  }
  onRemove() {}
}
function toggle3D(on) {
  S.d3 = on;
  document.querySelector(".ctrl-3d")?.setAttribute("aria-pressed", String(on));
  if (map.getLayer("b-edificios")) map.setLayoutProperty("b-edificios", "visibility", on ? "visible" : "none");
  if (on) {
    const z = map.getZoom();
    const fb = S.focus && bboxOf(S.focus.geom);
    map.easeTo({ pitch: 60, bearing: -17, zoom: Math.max(z, 14.2), duration: 1600, ...(fb && z < 14.2 ? { center: [(fb[0] + fb[2]) / 2, (fb[1] + fb[3]) / 2] } : {}) });
    if (z < 11) status("Vista 3D: busca un municipio o acércate a una ciudad para ver los edificios", 4000);
  } else map.easeTo({ pitch: 0, bearing: 0, duration: 900 });
}

// Botón «centrar»: vuelve a la vista de partida (la del foco si hay una provincia o municipio abiertos)
class HomeControl {
  onAdd() {
    const el = document.createElement("div");
    el.className = "maplibregl-ctrl maplibregl-ctrl-group";
    el.innerHTML = `<button type="button" class="maplibregl-ctrl-home" title="Centrar el mapa" aria-label="Centrar el mapa"><span class="maplibregl-ctrl-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="4.2" stroke="#00192C" stroke-width="1.6"/><circle cx="8" cy="8" r="1.4" fill="#00192C"/><path d="M8 1v2.2M8 12.8V15M1 8h2.2M12.8 8H15" stroke="#00192C" stroke-width="1.6" stroke-linecap="round"/></svg></span></button>`;
    el.querySelector("button").onclick = recenter;
    return el;
  }
  onRemove() {}
}
function recenter() {
  if (S.d3) { toggle3D(false); map.stop(); }
  map.setPitch(0); map.setBearing(0);
  if (S.focus) return fit(bboxOf(S.focus.geom), { padding: PAD() });
  const c = document.getElementById("sel-ccaa").value;
  fit(c ? S.ccaaBBox[c] : homeBB());
}

// Qué hay bajo el cursor, según el modo
function pickFeature(pt) {
  let layers;
  const fv = S.focusView === "municipios" ? "mun-fill" : "sscc-fill";
  if (S.focus) layers = [fv, "prov-fill"];
  else layers = { ccaa: ["ccaa-fill"], provincias: ["prov-fill"], municipios: ["mun-fill"], secciones: ["sscc-fill"] }[S.level];
  const fs = map.queryRenderedFeatures(pt, { layers }).filter(f => isAllowed(f.properties._cca));
  if (!fs.length) return null;
  if (S.focus) {
    const sec = fs.find(f => f.layer.id === fv && f.properties._cpro === S.focus.cpro);
    if (sec) return sec;
    const pv = fs.find(f => f.layer.id === "prov-fill" && f.properties._id !== S.focus.cpro);
    return pv || null;
  }
  return fs[0];
}
function onClick(e) {
  const f = pickFeature(e.point); if (!f) return;
  const id = f.properties._id;
  if (f.layer.id === "prov-fill") return focusProvince(id, e.lngLat);
  const src = { "ccaa-fill": "ccaa", "mun-fill": "mun", "sscc-fill": "sscc" }[f.layer.id];
  openPopup(src, id, e.lngLat);
}

// ── Carga de datos ────────────────────────────────────────────────
let munReady = null;
function loadMunicipios() {
  munReady = munReady || (async () => {
    const [mun, topo] = await Promise.all([getJSON(API.mun), getJSON(API.munGeo)]);
    S.mun = mun;
    const fc = topojson.feature(topo, topo.objects[Object.keys(topo.objects)[0]]);
    const iP = mun.cols.indexOf("pidx");
    fc.features.forEach(f => { const p = f.properties, row = mun.rows[p.CUMUN]; f.properties = { _id: p.CUMUN, _cca: p.CCA, _cpro: p.CUMUN.slice(0, 2), _p: row ? row[iP] : 5 }; });
    S.munFC = fc;
    map.getSource("mun").setData(fc);
    buildSearch(); updateCounts();
  })();
  return munReady;
}
function loadProvSscc(c) {
  if (S.sscc.has(c)) return Promise.resolve();
  if (!S.ssccLoading.has(c)) S.ssccLoading.set(c, (async () => {
    const [data, topo] = await Promise.all([getJSON(API.ssccData(c)), getJSON(API.ssccGeo(c))]);
    const fc = topojson.feature(topo, topo.objects[Object.keys(topo.objects)[0]]);
    const iP = data.cols.indexOf("pidx"), cca = S.cpro2cca[c];
    fc.features.forEach(f => { const id = f.properties.CUSEC, row = data.rows[id]; f.properties = { _id: id, _cca: cca, _cpro: c, _mun: id.slice(0, 5), _p: row ? row[iP] : 5 }; });
    S.sscc.set(c, { fc, data }); S.ssccLoading.delete(c);
  })());
  return S.ssccLoading.get(c);
}
// Secciones de toda España (o de las comunidades del rol): se cargan por provincia, primero las
// que están a la vista y después el resto, y se pintan según van llegando.
let ssccAll = null;
function ensureSecciones() {
  if (ssccAll) return ssccAll;
  const c = map.getCenter(), d2 = bb => ((bb[0] + bb[2]) / 2 - c.lng) ** 2 + ((bb[1] + bb[3]) / 2 - c.lat) ** 2;
  const queue = Object.keys(S.provBBox).filter(p => isAllowed(S.cpro2cca[p]) && !S.sscc.has(p)).sort((a, b) => d2(S.provBBox[a]) - d2(S.provBBox[b]));
  if (!queue.length) return Promise.resolve();
  const total = queue.length; let done = 0, last = 0;
  const step = () => { done++; const now = performance.now(); if (now - last > 600 || done === total) { last = now; if (S.level === "secciones" && !S.focus) pushSscc(); } if (S.level === "secciones" && !S.focus) status(done < total ? `Cargando secciones… ${done} de ${total} provincias` : "", done < total ? 0 : 1); };
  const worker = async () => { while (queue.length) { const p = queue.shift(); try { await loadProvSscc(p); } catch (e) { console.warn(p, e); } step(); } };
  ssccAll = Promise.all(Array.from({ length: 6 }, worker)).then(() => { pushSscc(); ssccAll = null; });
  return ssccAll;
}
function pushSscc() {
  const feats = [];
  for (const [c, v] of S.sscc) if (isAllowed(S.cpro2cca[c])) feats.push(...v.fc.features);
  map.getSource("sscc").setData({ type: "FeatureCollection", features: feats });
  updateCounts();
}

// ── Niveles, foco, filtros y rol ──────────────────────────────────
const ALL_LAYERS = ["ccaa-fill", "ccaa-hover", "prov-fill", "prov-hover", "mun-fill", "mun-line", "mun-hover", "sscc-fill", "sscc-line", "sscc-hover"];
const LAYERS = {

    const provs = S.focus ? [S.focus.cpro] : Object.keys(S.meta.provincias).filter(c => isAllowed(S.cpro2cca[c]));
    status(`Preparando ${provs.length} provincia${provs.length > 1 ? "s" : ""}…`);
    const datas = await Promise.all(provs.map(c => S.sscc.get(c)?.data ?? getJSON(API.ssccData(c))));
    lines.push(["Sección", "Comunidad", "Provincia", "Municipio", "Scoring sección", "Peso provincial", "Scoring final", "Prioridad", ...VH].join(";"));
    datas.forEach((data, i) => { const c = provs[i]; for (const [id, r] of Object.entries(data.rows)) { const o = rowObj(data.cols, r); if (!S.filters.has(o.pidx)) continue; if (S.focus?.type === "mun" && o.cumun !== S.focus.id) continue; lines.push([id, ccaaName(S.cpro2cca[c]), S.meta.provincias[c], S.mun.rows[o.cumun]?.[0] ?? "", o.score_orig, data.peso, o.score, PRIOS[o.pidx], ...VOTE.map(k => o[k])].map(csvCell).join(";")); } });
  } else if (lv === "municipios") {
    lines.push(["Cód. municipio", "Municipio", "Comunidad", "Provincia", "Índice municipal (0-10)", "Prioridad", "Scoring final medio", "Nº secciones", "% censo en Máxima/Alta", ...VH].join(";"));
    for (const [id, r] of Object.entries(S.mun.rows)) { const o = rowObj(S.mun.cols, r); if (!isAllowed(S.cpro2cca[o.cpro]) || !S.filters.has(o.pidx) || (S.focus && o.cpro !== S.focus.cpro)) continue; lines.push([id, o.name, ccaaName(S.cpro2cca[o.cpro]), S.meta.provincias[o.cpro], o.score, PRIOS[o.pidx], o.score_medio, o.n, o.pct_prior, ...VOTE.map(k => o[k])].map(csvCell).join(";")); }
  } else {
    const isP = lv === "provincias", src = isP ? S.terr.provincias : S.terr.ccaa;
    lines.push([isP ? "Cód. provincia" : "Cód. CCAA", isP ? "Provincia" : "Comunidad", "Scoring final medio", "Prioridad", "% censo en Máxima/Alta", "Secciones", ...PRIOS.map(p => `Secciones ${p}`), ...VH].join(";"));
    for (const [id, r] of Object.entries(src)) { const o = rowObj(S.terr.cols, r), cca = isP ? S.cpro2cca[id] : id; if (!isAllowed(cca)) continue; lines.push([id, o.name, o.score, isP ? S.meta.niveles_provincia[o.pidx] : PRIOS[o.pidx], o.pct_prior, o.n, ...o.dist, ...VOTE.map(k => o[k])].map(csvCell).join(";")); }
  }
  status("");
  return "﻿" + lines.join("\r\n");
}
async function download() {
  const btn = document.getElementById("dl"), txt = document.getElementById("dl-txt");
  btn.disabled = true;
  try {
    const csv = await buildCSV();
    const n = csv.split("\r\n").length - 1;
    const ambito = S.focus ? S.focus.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\W+/g, "_").toLowerCase() : (S.role === "nacional" ? "espana" : S.role);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = `prioridades_${S.focus ? S.focusView : S.level}_${ambito}_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    txt.textContent = `${fmtN.format(n)} filas descargadas`;
  } catch (e) {
    console.error(e); txt.textContent = "No se pudo descargar";
  } finally { btn.disabled = false; setTimeout(() => txt.textContent = "Descargar CSV", 2600); }
}

// ── UI ────────────────────────────────────────────────────────────
function bindUI() {
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { setLevel(b.dataset.lv); });
  document.getElementById("focus-exit").onclick = () => clearFocus(true);
  document.getElementById("sel-ccaa").onchange = e => { if (S.focus) clearFocus(false), setLevel(S.level); fit(e.target.value ? S.ccaaBBox[e.target.value] : homeBB()); };
  const q = document.getElementById("q");
  q.onfocus = () => loadMunicipios();
  q.oninput = () => search(q.value);
  q.onblur = () => setTimeout(() => document.getElementById("results").style.display = "none", 150);
  q.onkeydown = e => { if (e.key === "Enter") { const b = document.querySelector("#results button"); if (b) goMun(b.dataset.id); } };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.focus && document.activeElement !== q) clearFocus(true); });
  document.getElementById("dl").onclick = download;
  const panel = document.getElementById("panel");
  document.getElementById("panel-close").onclick = () => { panel.classList.add("closed"); document.getElementById("panel-open").focus(); };
  document.getElementById("panel-open").onclick = () => { panel.classList.remove("closed"); document.getElementById("panel-close").focus(); };
}

init().catch(e => { console.error(e); fatal("No se han podido cargar los datos. Recarga la página."); });
</script>
